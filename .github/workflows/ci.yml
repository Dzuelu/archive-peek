name: CI

on:
  push: {}
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Build fixtures
        run: ./test/fixtures/create-fixtures.sh

      - name: Test
        run: npm run test

      - name: Benchmarks
        run: npm run bench
